# Only the settings Spinoff needs; the CLI fills in defaults for the rest.
project_id = "spinoff"

# The browser calls these with the project's anon/publishable key. Newer
# publishable keys are not JWTs, so gateway JWT checks are off; the functions
# hold no user data. Add auth checks here when accounts arrive.
[functions.resolve-app]
verify_jwt = false

[functions.get-reviews]
verify_jwt = false

[functions.run-pass]
verify_jwt = false
